[workspace]
resolver = "2"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false
rust-version = "1.99"

[workspace.dependencies]
pv-model = { path = "crates/pv-model" }
pv-store = { path = "crates/pv-store" }
pv-statics = { path = "crates/pv-statics" }
pv-geo = { path = "crates/pv-geo" }
pv-layout = { path = "crates/pv-layout" }
pv-graph = { path = "crates/pv-graph" }
pv-pipeline = { path = "crates/pv-pipeline" }
pv-bom = { path = "crates/pv-bom" }
pv-roof = { path = "crates/pv-roof" }
pv-library = { path = "crates/pv-library" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v7", "serde"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
specta = { version = "=2.0.0-rc.26", features = ["derive", "uuid"] }
sha2 = "0.10.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2

# Geometry kernels run in tight loops (layout offset search): optimise them in dev too.
[profile.dev.package.pv-geo]
opt-level = 2

[profile.dev.package.pv-layout]
opt-level = 2

# The dependency graph's overhead is measured in tests (budget: 5 ms for 10 000 nodes).
[profile.dev.package.pv-graph]
opt-level = 2

[profile.dev.package.pv-model]
opt-level = 2

# Statics and the domain graph run in every property / end-to-end test.
[profile.dev.package.pv-statics]
opt-level = 2

[profile.dev.package.pv-pipeline]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
