[workspace]
resolver = "2"
members = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v7", "serde"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
specta = { version = "=2.0.0-rc.26", features = ["derive", "uuid"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
